<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/root.css">
    <link rel="stylesheet" href="./css/signUp.css">
</head>
<body>
        <!-- header-section -->
     <header> 
        <p> Need employees? Post here! </p>
     </header>
    
    <p class="heading"> Must Login/Sign-in to post -- job vacancy </p>

    <!-- sign-up forms -->
     <section class="sign-form">
        <p class="heading"> Fill up the form </p>
        <form id="form">
        <label for="email"> Email </label> <br>
        <input type="email" id="sIn-email" class="email" placeholder=" example@gmail.com "> <br>
        <label for="password"> Password </label> <br>
        <input type="password" id="sIn-password" class="password" placeholder=" •••••••••• "> <br>
        <button type="button" id="submit" class="button2"> Login </button>
        <button type="button" id="cancel" class="button2"> Cancel </button>
        </form>
        <p class="sub-heading"> New here? <a href="./signUp.js"> Create a new account. </a> </p>
     </section>

     <hr>

     <section>
      <p class="heading"> Current user status: </p>
      <ul class="sign-results"> 
         <li> Email: None </li>
         <li> Status: None</li>
         <li> UID: None</li>
         <li> Valid Until: -- </li>
      </ul>
     </section>

    <script src="./signUp.html"></script>

</body>
</html>
