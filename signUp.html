<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
    <link rel="stylesheet" href="./css/root.css">
    <link rel="stylesheet" href="./css/signUp.css">
</head>
<body>
        <!-- header-section -->
     <header> 
        <p> Post a job vacancy here! </p>
     </header>
    
    <p class="heading"> Must have an account to post -- job vacancy </p>

    <!-- sign-up forms -->
     <form class="sign-form" id="form">
        <p class="heading"> Fill up the form to register</p>
        <label for="signup-email"> Email </label> <br>
        <input type="email" id="signup-email" class="email" placeholder=" example@gmail.com " autocomplete="email" required> <br>
        <label for="signup-password"> Password </label> <br>
        <input type="password" id="signup-password" class="password" placeholder=" •••••••••• " autocomplete="new-password" minlength="8" required> <br>
        <button type="submit" id="signup-btn" class="button2"> sign-up </button>
        <!-- <button type="reset" id="cancel-btn" class="button2"> Cancel </button> -->
        <!-- signup message  -->
        <p class="heading" id="signup-message" role="status" aria-live="polite"></p>
        <p class="sub-heading"> Already have an account? <a href="./signIn.html"> Login ! </a> </p>
      </form>

     <hr>

     <section>
      <p class="heading"> Current user status: </p>
      <ul class="sign-results"> 
         <li id="semail"> Email: None </li>
         <li id="sstatus"> Status: None</li>
         <li id="suid"> UID: None</li>
         <li id="svalid"> Valid Until: -- </li>
      </ul>
     </section>

     <hr>
     <script src="./js/main.js"></script>
    <script src="./js/signUp.js"></script>

</body>
</html>
