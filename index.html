<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading country</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script> 
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header class="statement"> Welcome to the club </header>

    <section class="wrapper">
        <label for="country"> Nationality: </label> <br>
        <select autocomplete="on" name="country" id="country" class="country">
        <option value>Choose your country</option>
        <option value="AU">Australia</option>
        <option value="BR">Brazil</option>
        <option value="NP">Nepal</option>
        <option value="CN">China</option>
        <option value="CK">Cook Islands</option>
        <option value="FJ">Fizi</option>
        <option value="FR">France</option>
        <option value="NZ">New Zealand</option>
        <option value="JP">Japan</option>
        <option value="WS">Samoa</option>
        <option value="TO">Tonga</option>
        <option value="IE">Ireland</option>
        <option value="CA">Canada</option>
        <option value="PH">Philippines</option>
        <option value="SG">Singapore</option>
        <option value="ZA">South Africa</option>
        <option value="IN">India</option>
        <option value="US">United States</option>
        <option value="UK">United Kingdom</option>
        <option value=""> </option>
        </select> <br>
        <button type="submit" class="submit" onclick="loadCountry()">Load Country</button>
    </section>

    <script src="./supaabase.js"></script>
    <script src="./script.js"></script>
</body>
</html>
