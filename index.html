<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Jobs</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
    <link rel="stylesheet" href="./css/root.css" />
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <!-- header-section -->
    <header>
      <p>Need employees? Post here!</p>
    </header>

    <main>
      <!-- <p class="heading"> Supabase • Jobs </p> -->
      <p class="heading">
        You must be logged in to post a job vancy here.
        <a href="./signIn.html"> Login </a> /
        <a href="./signUp.html"> Sign - Up </a>
      </p>

      <!-- <div class="heading">
        <span id="log-in-status"> <strong> </strong> </span>
        <a href="./signIn.html" id="sign-in-link"> Login </a> /
        <a href="./signUp.html" id="sign-out-link"> Sign - Up </a>        
      </div> -->

      <hr />

      <form class="job-form" id="form">
        <section class="form-field">
          <div class="form-section">
            <label for="title">Job Title</label> <br> <br>
            <input type="text" id="title" class="title" placeholder="Junior Software Engineer" required>
          </div>

          <div class="form-section">
            <label for="description">Job Description</label> <br><br>
            <textarea id="description" class="description" placeholder="Job related requirments" required> </textarea>
          </div>

          <div class="form-section">
            <br><label for="salary-min"> Salary Range </label><br><br>
            <div class="range">
            <input type="number" id="salary-min" class="salary" placeholder="60000" required> <br><br>
            <span class="space">To</span> <br><br>
            <input type="number" id="salary-max" class="salary" placeholder="90000" required> <br>
            </div>
            <p class="hint"> E.g. 60,000 to 90,000</p> <br>
          </div>

          <div class="form-section">
            <label for="date"> Start Date </label> <br><br>
            <input type="date" id="date" class="date" required>
          </div>

          <div class="form-section">
            <label for="city">City</label> <br><br>
            <input type="text" id="city" class="city" placeholder="Enter city name" required> <br>
          </div>
        </section>
          <button type="submit" id="post" class="button"> POST </button>
          <p class="jobpost-status"> </p>
      </form>
      <p class="poster">Jobs on the board</p>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
